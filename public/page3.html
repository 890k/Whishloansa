<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Orange Money - Loan Application</title>

    <style>
        :root {
            --orange-primary: #f16e00;
            --orange-hover: #d66100;
            --bg-color: #e5e5e5;
            --card-bg: #ffffff;
            --text-main: #000000;
            --text-muted: #888888;
            --input-border: #e2e8f0;
        }

        * {
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        /* Top Header Navigation bar */
        .app-header {
            width: 100%;
            background-color: var(--orange-primary);
            height: 60px;
            padding: 0 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .back-btn {
            color: white;
            text-decoration: none;
            font-weight: 600;
            font-size: 15px;
            cursor: pointer;
        }

        .header-title {
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            font-size: 20px;
            font-weight: 800;
        }

        .header-title .orange { color: #ffffff; opacity: 0.95; margin-right: 4px; }
        .header-title .money { color: #000000; }

        /* Card Layout */
        .card {
            background: white;
            width: 90%;
            max-width: 440px;
            margin: 20px 0 30px;
            padding: 32px 24px;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
            display: flex;
            flex-direction: column;
        }

        .main-title {
            font-size: 26px;
            color: var(--text-main);
            margin: 0 0 6px;
            text-align: center;
            font-weight: 800;
            letter-spacing: -0.3px;
        }

        .subtext {
            font-size: 14px;
            color: var(--text-muted);
            text-align: center;
            margin-bottom: 20px;
        }

        /* Step Progress Bar */
        .step-indicator {
            display: flex;
            justify-content: space-between;
            gap: 12px;
            margin: 0 auto 32px;
            width: 80%;
        }

        .step-bar {
            flex: 1;
            height: 4px;
            background-color: #e2e8f0;
            border-radius: 2px;
        }

        .step-bar.active {
            background-color: var(--orange-primary);
        }

        /* Form Inputs */
        .form-group {
            margin-bottom: 22px;
            display: flex;
            flex-direction: column;
        }

        .form-group label {
            font-size: 15px;
            font-weight: 700;
            color: #222222;
            margin-bottom: 10px;
        }

        .form-control {
            font-size: 15px;
            padding: 14px 16px;
            border: 1px solid var(--input-border);
            border-radius: 10px;
            background-color: #ffffff;
            color: #333333;
            outline: none;
            width: 100%;
            box-shadow: 0 1px 2px rgba(0,0,0,0.02);
        }

        .form-control:focus {
            border-color: var(--orange-primary);
        }

        select.form-control {
            appearance: none;
            background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23555555' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");
            background-repeat: no-repeat;
            background-position: right 16px center;
            background-size: 14px;
            padding-right: 40px;
            cursor: pointer;
        }

        textarea.form-control {
            resize: vertical;
            min-height: 100px;
            font-family: inherit;
        }

        .btn-submit {
            background-color: var(--orange-primary);
            color: white;
            border: none;
            width: 100%;
            padding: 16px;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 800;
            cursor: pointer;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            transition: background-color 0.2s;
            margin-top: 10px;
        }

        .btn-submit:hover {
            background-color: var(--orange-hover);
        }

        .footer-banner {
            width: 100%;
            text-align: center;
            padding: 20px;
            font-size: 12px;
            color: #666666;
            margin-top: auto;
        }
    </style>
</head>

<body>

<div class="app-header">
    <a href="#" class="back-btn" onclick="alert('Back button clicked')">← Back</a>
    <div class="header-title">
        <span class="orange">Orange</span><span class="money">Money</span>
    </div>
    <div></div>
</div>

<div class="card">
    <h1 class="main-title">Loan Application</h1>
    <div class="subtext">Step 1 of 3</div>

    <div class="step-indicator">
        <div class="step-bar active"></div>
        <div class="step-bar"></div>
        <div class="step-bar"></div>
    </div>

    <form id="loanForm">
        <div class="form-group">
            <label for="loanType">Loan Type</label>
            <select id="loanType" class="form-control" required>
                <option value="Personal Loan" selected>Personal Loan</option>
                <option value="Business Loan">Business Loan</option>
                <option value="Education Loan">Education Loan</option>
                <option value="Emergency Loan">Emergency Loan</option>
            </select>
        </div>

        <div class="form-group">
            <label for="loanAmt">Loan Amount (XAF)</label>
            <input type="number" id="loanAmt" class="form-control" placeholder="250000" value="250000" min="5000" step="1000" required>
        </div>

        <div class="form-group">
            <label for="loanTerm">Loan Term</label>
            <select id="loanTerm" class="form-control" required>
                <option value="6 Months">6 Months</option>
                <option value="12 Months" selected>12 Months</option>
                <option value="18 Months">18 Months</option>
                <option value="24 Months">24 Months</option>
                <option value="36 Months">36 Months</option>
            </select>
        </div>

        <div class="form-group">
            <label for="loanPurpose">Purpose of the Loan</label>
            <textarea id="loanPurpose" class="form-control" placeholder="Explain what you will use this loan for..." required></textarea>
        </div>

        <button type="submit" class="btn-submit">CONTINUE →</button>
    </form>
</div>

<div class="footer-banner">
    © 2026 Orange Money Cameroon
</div>

<script>
    document.getElementById('loanForm').addEventListener('submit', function(event) {
        event.preventDefault();

        const loanType = document.getElementById('loanType').value;
        const loanAmt = Number(document.getElementById('loanAmt').value);
        const loanTerm = document.getElementById('loanTerm').value;
        const loanPurpose = document.getElementById('loanPurpose').value.trim();

        if (!loanPurpose) {
            alert('Please fill out the purpose of your loan.');
            return;
        }

        // Calculate estimated monthly payment (5% annual interest rate base)
        const months = Number(loanTerm.replace(/\D/g, '')) || 12;
        const totalInterest = loanAmt * 0.05 * (months / 12);
        const monthlyPayment = Math.round((loanAmt + totalInterest) / months);

        // Store data locally
        localStorage.setItem('loan_type', loanType);
