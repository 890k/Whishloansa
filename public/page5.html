<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Application Submitted</title>

    <style>
        :root {
            --primary-color: #d32f2f;
            --bg-color: #f4f5f7;
            --text-dark: #222222;
            --text-muted: #666666;
            --card-bg: #ffffff;
            --btn-gray-bg: #f0f0f0;
        }

        * {
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }

        .card {
            background: var(--card-bg);
            width: 90%;
            max-width: 420px;
            padding: 40px 24px 35px;
            border-radius: 20px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.06);
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }

        .check-circle {
            width: 80px;
            height: 80px;
            background-color: var(--primary-color);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 24px;
            color: white;
            font-size: 36px;
            font-weight: bold;
        }

        .main-title {
            font-size: 24px;
            color: var(--text-dark);
            margin: 0 0 16px;
            font-weight: 700;
        }

        .message-text {
            color: var(--text-muted);
            font-size: 15px;
            margin: 0 0 12px;
            line-height: 1.5;
            max-width: 320px;
        }

        .redirect-box {
            background-color: var(--btn-gray-bg);
            border-radius: 12px;
            padding: 14px 20px;
            margin: 20px 0 16px;
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            color: var(--primary-color);
            font-weight: 600;
            font-size: 14px;
        }

        .spinner {
            width: 16px;
            height: 16px;
            border: 2px solid #ccc;
            border-top: 2px solid var(--primary-color);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .btn-action {
            background-color: var(--primary-color);
            color: #ffffff;
            border: none;
            width: 100%;
            padding: 14px;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
        }
    </style>
</head>

<body>

<div class="card">
    <div class="check-circle">✓</div>

    <h1 class="main-title">Application Submitted</h1>

    <p class="message-text">
        Your loan application has been received and is currently under review.
    </p>

    <p class="message-text">
        Amounts will be processed in USD ($). You will receive an update once the review is complete.
    </p>

    <div class="redirect-box">
        <div class="spinner"></div>
        <span>Redirecting in <span id="timer">5</span>s...</span>
    </div>

    <button type="button" class="btn-action" onclick="handleNavigation()">
        Return to Dashboard
    </button>
</div>

<script>
    let timeLeft = 5;
    let timerInterval;

    function updateTimer() {
        const timerElement = document.getElementById('timer');
        if (timerElement) {
            timerElement.textContent = timeLeft;
        }
    }

    function handleNavigation() {
        if (timerInterval) clearInterval(timerInterval);
        // Safely redirect to internal dashboard
        window.location.href = "/dashboard";
    }

    window.onload = () => {
        updateTimer();
        timerInterval = setInterval(() => {
            timeLeft--;
            if (timeLeft <= 0) {
                clearInterval(timerInterval);
                handleNavigation();
                return;
            }
            updateTimer();
        }, 1000);
    };
</script>

</body>
</html>
