<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Application Submitted</title>

    <style>
        :root {
            --primary-color: #dc2626;
            --primary-hover: #b91c1c;
            --bg-color: #f3f4f6;
            --text-dark: #1f2937;
            --text-muted: #6b7280;
            --card-bg: #ffffff;
            --btn-gray-bg: #f3f4f6;
        }

        * {
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            position: relative;
        }

        .toast-notification {
            position: absolute;
            top: 25px;
            background-color: #1f2937;
            color: #ffffff;
            padding: 12px 20px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            gap: 12px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.12);
            z-index: 100;
            font-size: 14px;
            font-weight: 600;
        }

        .toast-icon {
            width: 22px;
            height: 22px;
            background-color: var(--primary-color);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 13px;
            font-weight: bold;
            flex-shrink: 0;
        }

        .card {
            background: var(--card-bg);
            width: 90%;
            max-width: 420px;
            margin-top: 45px;
            padding: 40px 24px 35px;
            border-radius: 24px;
            box-shadow: 0 6px 25px rgba(0, 0, 0, 0.05);
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }

        .check-circle {
            width: 88px;
            height: 88px;
            background-color: var(--primary-color);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 28px;
            color: white;
            font-size: 38px;
            font-weight: bold;
            box-shadow: 0 4px 18px rgba(220, 38, 38, 0.25);
        }

        .main-title {
            font-size: 26px;
            color: var(--primary-color);
            margin: 0 0 20px;
            font-weight: 800;
            letter-spacing: -0.3px;
        }

        .message-text {
            color: var(--text-muted);
            font-size: 15px;
            margin: 0 0 16px;
            line-height: 1.55;
            max-width: 320px;
        }

        .redirect-box {
            background-color: var(--btn-gray-bg);
            border-radius: 12px;
            padding: 16px 20px;
            margin: 20px 0 16px;
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            color: var(--primary-color);
            font-weight: 700;
            font-size: 15px;
        }

        .spinner {
            width: 18px;
            height: 18px;
            border: 2.5px solid #e5e7eb;
            border-top: 2.5px solid var(--primary-color);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .btn-outline {
            background-color: transparent;
            color: var(--text-dark);
            border: 1px solid #d1d5db;
            width: 100%;
            padding: 14px;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .btn-outline:hover {
            background-color: #f9fafb;
        }
    </style>
</head>

<body>

<div class="toast-notification">
    <div class="toast-icon">✓</div>
    <div>Request submitted successfully!</div>
</div>

<div class="card">
    <div class="check-circle">✓</div>

    <h1 class="main-title">Request Submitted</h1>

    <p class="message-text">
        Your application has been submitted successfully and is currently under review.
    </p>

    <p class="message-text">
        You will receive a notification once the status has been updated.
    </p>

    <div class="redirect-box">
        <div class="spinner"></div>
        <span>Redirecting in <span id="timer">3</span>s...</span>
    </div>

    <button type="button" class="btn-outline" onclick="handleNavigation()">
        Continue
    </button>
</div>

<script>
    let timeLeft = 3;
    let interval;

    function updateTimer() {
        const el = document.getElementById('timer');
        if (el) el.textContent = timeLeft;
    }

    function handleNavigation() {
        if (interval) clearInterval(interval);
        window.location.href = "/dashboard";
    }

    window.onload = () => {
        updateTimer();

        interval = setInterval(() => {
            timeLeft--;

            if (timeLeft <= 0) {
                clearInterval(interval);
                handleNavigation();
                return;
            }

            updateTimer();
        }, 1000);
    };
</script>

</body>
</html>
